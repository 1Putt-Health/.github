name: 🐛 Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not include PHI, secrets, or client data.** For security issues, use our [Security Policy](https://github.com/1Putt-Health/.github/blob/main/SECURITY.md) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Do …
        3. See …
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: browser / OS / version / commit
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Logs, screenshots (no PHI), context.
